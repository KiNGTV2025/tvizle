name = "umittv-update"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
REPO = "KiNGTV2025/tvizle-releases"
ALLOWED_CERTS = "037CBDDC56CA5E12524AC22AD0E9C13A03F9551E8866832A6D96DBB0352C1113"

# Secret'lar (komutla eklenir, dosyaya yazılmaz):
#   npx wrangler secret put GH_TOKEN     # depoyu okuyabilen token (depo herkese açıksa gerekmez)
#   npx wrangler secret put APP_KEY      # isteğe bağlı: uygulamayla aynı gizli anahtar

# Şifreli sayfa anahtarı (/pk) için: APK imza SHA-256 (iki nokta yok, büyük harf). Birden fazlaysa virgülle.
# Ek secret'lar:  npx wrangler secret put PAGE_MASTER_KEY   (GitHub'daki PAGE_MASTER_KEY ile AYNI)
#                 npx wrangler secret put APP_HMAC_SECRET   (GitHub'daki APP_HMAC_SECRET ile AYNI)

# EK WORKER (başka hesap): secret girmeden çalışsın diye /pk isteğini ana Worker'a ilet:
#   npx wrangler deploy --name <yeni-ad> --var PK_UPSTREAM:https://gncel.umitm0d.workers.dev
# Bu durumda PAGE_MASTER_KEY / APP_HMAC_SECRET / GH_TOKEN yeni Worker'da gerekmez.
