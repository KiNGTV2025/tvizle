name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: read
env:
  # APK'ların yayınlandığı PUBLIC depo (kaynak kod deposu özel kalır)
  REL_REPO: KiNGTV2025/tvizle-releases
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Sürümü version.txt'den oku (örn. 1.7 -> kod 17)
        id: ver
        run: |
          VN=$(tr -d ' \r\n' < version.txt)
          if ! [[ "$VN" =~ ^[0-9]+\.[0-9]$ ]]; then echo "version.txt biçimi hatalı: '$VN' (örnek: 1.7)"; exit 1; fi
          V=$(( ${VN%.*} * 10 + ${VN#*.} ))
          echo "vcode=$V" >> "$GITHUB_OUTPUT"
          echo "vname=$VN" >> "$GITHUB_OUTPUT"
      - name: Keystore'u hazırla
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Derle ve imzala
        run: gradle assembleRelease -Pvcode=${{ steps.ver.outputs.vcode }} -Pvname=${{ steps.ver.outputs.vname }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          REL_READ_TOKEN: ${{ secrets.REL_READ_TOKEN }}
          APP_HMAC_SECRET: ${{ secrets.APP_HMAC_SECRET }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: umitlauncher
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: UmitTV-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Özete indirme linkini yaz
        run: |
          echo "### 📦 APK hazır" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[⬇️ UmitTV APK'yı indir](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Release olarak yayınla (uygulama buradan otomatik günceller)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.vcode }}"
          if gh release view "$TAG" --repo "$REL_REPO" >/dev/null 2>&1; then
            echo "Release $TAG zaten var, yayınlanmadı. Yeni sürüm için version.txt'yi artır." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk UmitTV.apk
          gh release create "$TAG" UmitTV.apk --repo "$REL_REPO" --title "${{ steps.ver.outputs.vname }}" --notes "ÜmitTV ${{ steps.ver.outputs.vname }}" --latest
