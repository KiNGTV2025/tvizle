name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Keystore'u hazırla
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Derle ve imzala
        run: gradle assembleRelease -Pvcode=$((100 + GITHUB_RUN_NUMBER)) -Pvname=1.$((GITHUB_RUN_NUMBER))
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: umitlauncher
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: UmitTV-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Özete indirme linkini yaz
        run: |
          echo "### 📦 APK hazır" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[⬇️ UmitTV APK'yı indir](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Release olarak yayınla (uygulama buradan otomatik günceller)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER))
          cp app/build/outputs/apk/release/app-release.apk UmitTV.apk
          gh release create "v$VC" UmitTV.apk --title "ÜmitTV 1.$GITHUB_RUN_NUMBER" --notes "Otomatik derleme" --latest
